BootSequence [
	# Set DAC vol to 0 dB (191/191)
	cset "name='DAC Playback Volume' 191"

	# Disable Auto Level Control
	cset "name='ALC Capture Switch' off"
	# Set ADC vol to 0 dB (191/255)
	cset "name='ADC Capture Volume' 191"
	# Set Mic amplifier to +21 dB
	cset "name='ADC PGA Gain Volume' 7"

	# Set playback polarity to normal
	cset "name='Playback Polarity' 0"
]
