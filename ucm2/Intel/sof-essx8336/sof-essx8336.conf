Syntax 6

Include.codec-init.File "/codecs/es8316/init.conf"

Define.DeviceDmic ""

If.devdmic {
	Condition {
		Type String
		Haystack "${CardComponents}"
		Needle "cfg-dmics:"
	}
	True.Define.DeviceDmic "Mic"
}

SectionUseCase."HiFi" {
	File "/Intel/sof-essx8336/HiFi.conf"
	Comment "Play and record HiFi quality Music"
}
If.dmic {
	Condition {
		Type String
		Empty "${var:DeviceDmic}"
	}
	False.If.Dmic0 {
		Condition {
			Type ControlExists
			Control "name='Dmic0 Capture Volume'"
		}
		True.BootSequence [
			cset "name='Dmic0 Capture Volume' 70%"
		]
	}
}
