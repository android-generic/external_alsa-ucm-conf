Syntax 6

Define.DeviceDmic ""
Define.Codec "es8316"
Define.InternalMic "IN1-InternalMic"

If.codec {
	Condition {
		Type ControlExists
		Control "name='Differential Mux'"
	}
	True.Include.codec-init.File "/codecs/es8316/init.conf"
	False {
		Define.Codec "es8326"
		Define.InternalMic "InternalMic"
		Include.codec-init.File "/codecs/es8326/init.conf"
	}
}

If.devdmic {
	Condition {
		Type String
		Haystack "${CardComponents}"
		Needle "cfg-dmics:"
	}
	True.Define.DeviceDmic "Mic"
}

SectionUseCase."HiFi" {
	File "/Intel/sof-essx8336/HiFi.conf"
	Comment "Play and record HiFi quality Music"
}
If.dmic {
	Condition {
		Type String
		Empty "${var:DeviceDmic}"
	}
	False.If.Dmic0 {
		Condition {
			Type ControlExists
			Control "name='Dmic0 Capture Volume'"
		}
		True.BootSequence [
			cset "name='Dmic0 Capture Volume' 70%"
		]
	}
}
