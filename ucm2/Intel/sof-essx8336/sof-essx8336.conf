Syntax 6

# The sof-essx8336 machine driver is shared by ES8316, ES8336 and ES8326.
# ES8316/ES8336 expose the 'Differential Mux' / 'Digital Mic Mux' /
# 'Headphone Mixer' family of controls, ES8326 does not. Any cset on a
# missing control aborts the whole sequence, so gate the ES8316-only
# controls on their presence.
Define.CodecEs8326 ""

If.es8326 {
	Condition {
		Type ControlExists
		Control "name='Differential Mux'"
	}
	False.Define.CodecEs8326 "1"
}

BootSequence [
	# Set DAC vol
	cset "name='DAC Playback Volume' 60%"

	# Disable Auto Level Control
	cset "name='ALC Capture Switch' off"

	# Set capture vol
	cset "name='ADC Capture Volume' 60%"
]

If.es8316boot {
	Condition {
		Type String
		Empty "${var:CodecEs8326}"
	}
	True.BootSequence [
		# Setup muxes / switches
		cset "name='Left Headphone Mixer Left DAC Switch' on"
		cset "name='Right Headphone Mixer Right DAC Switch' on"
		# Set digital mix mux to "dmic disable"
		# That doesn't affect dmic, but other values mute headset mic
		cset "name='Digital Mic Mux' 0"

		# Set HP vol to 0 dB
		cset "name='Headphone Playback Volume' 100%"
		cset "name='Headphone Mixer Volume' 100%"

		# LDATA TO LDAC, RDATA TO RDAC
		cset "name='DAC Source Mux' 0"
	]
}

Define.DeviceDmic ""

If.devdmic {
	Condition {
		Type String
		Haystack "${CardComponents}"
		Needle "cfg-dmics:"
	}
	True.Define.DeviceDmic "Mic"
}

SectionUseCase."HiFi" {
	File "/Intel/sof-essx8336/HiFi.conf"
	Comment "Play and record HiFi quality Music"
}
If.dmic {
	Condition {
		Type String
		Empty "${var:DeviceDmic}"
	}
	False.If.Dmic0 {
		Condition {
			Type ControlExists
			Control "name='Dmic0 Capture Volume'"
		}
		True.BootSequence [
			cset "name='Dmic0 Capture Volume' 70%"
		]
	}
}

